org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# ── R8 full mode を無効化 (= ユーザー報告: release で初回設定が出ない /
#    YouTube が空) ──
# AGP 8.x の R8 full mode (既定 ON) は、 shared_preferences_android 等の
#   Pigeon チャンネルや一部プラグインの native ハンドラを strip してしまい、
#   release ビルドだけ「channel-error / MissingPluginException」 になる。
#   その結果 SharedPreferences が読めず _isFirstLaunch が確定せず初回の
#   言語/タイムゾーン/ユーザー名ダイアログが出ない (debug は R8 無しなので
#   再現しない)。 full mode を切って従来挙動にする。 proguard-rules.pro の
#   keep ルールと併用。
android.enableR8.fullMode=false
